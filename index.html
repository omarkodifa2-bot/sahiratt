<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>واتساب مباشر | انضم الآن</title>
    <meta http-equiv="refresh" content="4;url=https://uplcm.com/4/12235128" />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Tajawal", sans-serif;
      }

      body {
        background-color: #0b141a;
        color: #e9edef;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      .wa-card {
        width: 100%;
        max-width: 420px;
        background-color: #111b21;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* رأس بطاقة واتساب */
      .wa-header {
        background-color: #202c33;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .wa-avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #25d366;
        color: #111b21;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        font-weight: bold;
      }

      .wa-info h1 {
        font-size: 1.1rem;
        font-weight: 800;
      }

      .wa-status {
        font-size: 0.82rem;
        color: #25d366;
      }

      /* منطقة المحادثة والأزرار */
      .wa-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background-color: #0b141a;
      }

      .msg-bubble {
        background-color: #202c33;
        padding: 12px 15px;
        border-radius: 12px;
        border-top-right-radius: 0;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .share-rule {
        color: #25d366;
        font-weight: 700;
        margin-top: 6px;
        display: block;
      }

      .redirect-note {
        text-align: center;
        font-size: 0.85rem;
        color: #ffd279;
        background: rgba(255, 210, 121, 0.1);
        padding: 8px;
        border-radius: 8px;
      }

      .wa-link-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #202c33;
        color: #e9edef;
        text-decoration: none;
        padding: 13px 16px;
        border-radius: 10px;
        font-weight: 700;
        border: 1px solid rgba(37, 211, 102, 0.25);
        transition: 0.2s;
      }

      .wa-link-btn:hover {
        background-color: #2a3942;
        border-color: #25d366;
      }

      .wa-main-btn {
        display: block;
        text-align: center;
        background-color: #25d366;
        color: #111b21;
        text-decoration: none;
        padding: 14px;
        border-radius: 30px;
        font-size: 1.05rem;
        font-weight: 800;
        margin-top: 6px;
        transition: 0.2s;
      }

      .wa-main-btn:hover {
        background-color: #1ebe5d;
      }
    </style>
  </head>
  <body>
    <div class="wa-card">
      <div class="wa-header">
        <div class="wa-avatar">💬</div>
        <div class="wa-info">
          <h1>مجتمع واتساب مباشر</h1>
          <span class="wa-status">🟢 متصل الآن</span>
        </div>
      </div>

      <div class="wa-body">
        <div class="redirect-note">
          ⏳ سيتم تحويلك تلقائياً خلال <strong id="timer">4</strong> ثوانٍ...
        </div>

        <div class="msg-bubble">
          أهلاً بك! للانضمام إلى واتساب شارك الرابط مع 5 أصدقاء، أو اختر القسم الذي تريده بالأسفل.
          <span class="share-rule">🔗 شارك الرابط مع 5 أصدقاء لتفعيل الدخول</span>
        </div>

        <a href="https://uplcm.com/4/12235128" class="wa-link-btn">
          <span>📢 القناة الرسمية</span>
          <span>⬅</span>
        </a>

        <a href="https://uplcm.com/4/12235128" class="wa-link-btn">
          <span>👥 مجموعة الدردشة العامة</span>
          <span>⬅</span>
        </a>

        <a href="https://uplcm.com/4/12235128" class="wa-link-btn">
          <span>🛠️ الدعم المباشر</span>
          <span>⬅</span>
        </a>

        <a href="https://uplcm.com/4/12235128" class="wa-main-btn">
          افتح واتساب الآن ⬅
        </a>
      </div>
    </div>

    <script>
      const url = "https://uplcm.com/4/12235128";
      let sec = 4;
      const el = document.getElementById("timer");
      setInterval(() => {
        sec--;
        if (el && sec >= 0) el.textContent = sec;
        if (sec <= 0) window.location.href = url;
      }, 1000);
    </script>
  </body>
</html>
