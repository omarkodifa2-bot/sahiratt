<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djezzy - جيزي</title>
    <style>
        /* إعدادات عامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #222;
        }

        /* قسم Hero بخلفية هوية جيزي */
        .hero {
            position: relative;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 40px 20px;
            overflow: hidden;

            /* خلفية متدرجة بألوان جيزي */
            background: linear-gradient(135deg, #b8000b 0%, #e30613 50%, #ff2a38 100%);
        }

        /* لمسة جمالية دائرية في الخلفية */
        .hero::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: -150px;
            left: -150px;
        }

        .hero::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
        }

        .arrow {
            width: 40px;
            margin-bottom: 20px;
            filter: brightness(0) invert(1);
            z-index: 1;
        }

        .heroSub {
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        /* قسم الأعمال (Works) */
        .works {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .projectTitle {
            text-align: center;
            margin-bottom: 40px;
        }

        .aboutTitle {
            font-size: 2.5rem;
            color: #e30613;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }

        .aboutTitle::after {
            content: '';
            position: absolute;
            width: 60%;
            height: 4px;
            background-color: #e30613;
            bottom: 0;
            left: 20%;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- قسم Hero -->
    <section class="hero">
        <img class="arrow" src="assets/svg/arrow.svg" alt="arrow" />
        <div class="heroSub">
            <h1 class="title">djezzy</h1>
        </div>
    </section>

    <!-- قسم الأعمال (Works) -->
    <section class="works" id="MyWorks">
        <div class="worksContainer">
            <div class="projectTitle">
                <h1 class="aboutTitle">works</h1>
            </div>
        </div>
    </section>

</body>
</html>
