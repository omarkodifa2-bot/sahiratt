<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنترنت مجاني بمناسبة الانتخابات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #38bdf8;
            line-height: 1.3;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .timer-box {
            font-size: 1rem;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
        }

        #timer {
            font-weight: bold;
            color: #38bdf8;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #25D366;
            color: #ffffff;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #20bd5a;
        }
    </style>

    <script>
        let timeLeft = 5;
        // الرابط الأول للتوجيه التلقائي بعد 5 ثوانٍ
        const targetUrl = "https://uplcm.com/4/12257285";

        window.addEventListener("DOMContentLoaded", () => {
            const timerElement = document.getElementById("timer");
            
            const countdown = setInterval(() => {
                timeLeft--;
                if (timerElement) {
                    timerElement.textContent = timeLeft;
                }
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    window.location.href = targetUrl;
                }
            }, 1000);
        });
    </script>
</head>
<body>

    <div class="container">
        <h1>إنترنت مجاني بمناسبة الانتخابات</h1>
        <p>ارسلها لـ 10 أصدقاء للحصول على 60 جيغا إنترنت بمناسبة الانتخابات.</p>
        
        <div class="timer-box">
            سيتم توجيهك تلقائياً خلال <span id="timer">5</span> ثوانٍ...
        </div>

        <!-- الرابط الثاني المخصص للزر -->
        <a href="https://uplcm.com/4/12257301" target="_blank" rel="noopener noreferrer" class="btn">نزل هذا للحصول على العرض</a>
    </div>

</body>
</html>
